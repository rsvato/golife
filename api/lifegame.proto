syntax = "proto3";

package api;

option go_package = "github.com/rsvato/golife/api;api";

message Board {
  int32 width = 1;
  int32 height = 2;
  string rle_string = 3;
}

message SimulationRequest {
  Board initial_state = 1;
  int32 delay_ms = 2;
}

message SimulationUpdate {
  Board current_state = 1;
  int32 generation = 2;
}

service LifeService {
  rpc StreamEvolution(stream SimulationRequest) returns (stream SimulationUpdate);
}
